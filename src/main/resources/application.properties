spring.application.name=appointment
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spirit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=appointment-slot-recovery
app.jwt.access-token-minutes=30
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.flyway.enabled=false
